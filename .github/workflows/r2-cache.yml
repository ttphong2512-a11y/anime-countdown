# ============================================================
# WHY2YUE — ANIME CACHE UPDATE
# ============================================================
#
# AniList
#    ↓
# GitHub Actions
#    ↓
# update-cache.js
#    ↓
# Cloudflare R2
#
# Chạy tự động mỗi 3 giờ.
#
# Có thể chạy thủ công bằng nút:
# Actions → Update Anime Cache → Run workflow
# ============================================================

name: Update Anime Cache

on:

  # ----------------------------------------------------------
  # TỰ ĐỘNG
  # ----------------------------------------------------------
  schedule:

    # Phút 17, mỗi 3 giờ.
    #
    # 00:17
    # 03:17
    # 06:17
    # 09:17
    # ...
    #
    - cron: "17 */3 * * *"


  # ----------------------------------------------------------
  # CHẠY THỦ CÔNG
  # ----------------------------------------------------------
  workflow_dispatch:


jobs:

  update-cache:

    runs-on: ubuntu-latest


    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # NODE.JS
      # ------------------------------------------------------

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20


      # ------------------------------------------------------
      # INSTALL AWS SDK
      # ------------------------------------------------------

      - name: Install dependencies

        run: |

          npm install --no-save @aws-sdk/client-s3


      # ------------------------------------------------------
      # UPDATE R2
      # ------------------------------------------------------

      - name: Update R2 anime cache

        env:

          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}

          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_ENDPOINT: https://5cdad020d02db4b8aa5b7b96fe8282ce.r2.cloudflarestorage.com

          R2_BUCKET: ogeview-anime

        run: |

          node .github/workflows/update-cache.js
