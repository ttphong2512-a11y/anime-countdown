# ============================================================
# WHY2YUE — R2 ANIME CACHE UPDATE
# ============================================================
#
# AniList
#    ↓
# GitHub Actions
#    ↓
# update-cache.js
#    ↓
# Cloudflare R2
#
# Mỗi anime:
#
# anime/21.json
# anime/196017.json
# anime/16498.json
# ...
#
# ============================================================

name: Update Anime Cache


# ============================================================
# TRIGGER
# ============================================================

on:

  # ----------------------------------------------------------
  # TỰ ĐỘNG MỖI 3 GIỜ
  # ----------------------------------------------------------

  schedule:

    - cron: "17 */3 * * *"


  # ----------------------------------------------------------
  # CHẠY THỦ CÔNG
  # ----------------------------------------------------------

  workflow_dispatch:


# ============================================================
# CHỐNG CHẠY CHỒNG
# ============================================================

concurrency:

  group:
    why2yue-anime-cache

  cancel-in-progress:
    false


# ============================================================
# JOB
# ============================================================

jobs:

  update-cache:

    runs-on:
      ubuntu-latest


    # ========================================================
    # PERMISSIONS
    # ========================================================

    permissions:

      contents:
        read


    steps:


      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name:
          Checkout repository

        uses:
          actions/checkout@v4


      # ======================================================
      # 2. NODE.JS
      # ======================================================

      - name:
          Setup Node.js

        uses:
          actions/setup-node@v4

        with:

          node-version:
            20


      # ======================================================
      # 3. INSTALL AWS SDK
      # ======================================================

      - name:
          Install R2 SDK

        run:
          npm install --no-save @aws-sdk/client-s3


      # ======================================================
      # 4. UPDATE R2
      # ======================================================

      - name:
          Update R2 anime cache

        env:

          # --------------------------------------------------
          # R2 credentials
          # --------------------------------------------------

          R2_ACCESS_KEY_ID:
            ${{ secrets.R2_ACCESS_KEY_ID }}

          R2_SECRET_ACCESS_KEY:
            ${{ secrets.R2_SECRET_ACCESS_KEY }}


          # --------------------------------------------------
          # R2 endpoint
          # --------------------------------------------------

          R2_ENDPOINT:
            https://5cdad020d02db4b8aa5b7b96fe8282ce.r2.cloudflarestorage.com


          # --------------------------------------------------
          # Bucket
          # --------------------------------------------------

          R2_BUCKET:
            ogeview-anime


          # --------------------------------------------------
          # PINNED ANIME
          #
          # Các ID này LUÔN được cập nhật.
          #
          # Không phụ thuộc:
          # top anime
          # popularity
          # start date
          # page AniList
          #
          # Test hiện tại:
          # One Piece = 21
          # Anime mẫu = 196017
          #
          # Khi thêm anime mới:
          # chỉ cần thêm ID vào đây MỘT LẦN.
          #
          # Ví dụ:
          #
          # 21,196017,16498,1535
          #
          # Sau khi file tồn tại trên R2,
          # những lần sau script tự phát hiện file đó.
          # --------------------------------------------------

          ANIME_IDS:
            "21,196017"


        run:

          node .github/workflows/update-cache.js
