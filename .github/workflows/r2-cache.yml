# ============================================================
# WHY2YUE — R2 ANIME CACHE
# ============================================================

name: Update Anime Cache

# ============================================================
# TRIGGERS
# ============================================================
#
# push:
#   Khi anime-ids.json được commit thay đổi
#   → chỉ xử lý anime ID mới.
#
# schedule:
#   Mỗi 3 giờ
#   → kiểm tra/cập nhật toàn bộ anime.
#
# workflow_dispatch:
#   Chạy thủ công
#   → kiểm tra/cập nhật toàn bộ anime.
#
# ============================================================

on:

  # ----------------------------------------------------------
  # Khi thay đổi anime-ids.json
  # ----------------------------------------------------------

  push:

    paths:
      - "anime-ids.json"

  # ----------------------------------------------------------
  # Kiểm tra định kỳ mỗi 3 giờ
  # ----------------------------------------------------------

  schedule:

    - cron: "17 */3 * * *"

  # ----------------------------------------------------------
  # Chạy thủ công
  # ----------------------------------------------------------

  workflow_dispatch:

# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write

# ============================================================
# CONCURRENCY
# ============================================================
#
# Không cho nhiều lần update cache chạy chồng lên nhau.
#
# cancel-in-progress: false
# → không hủy job đang chạy.
# → job mới sẽ chờ job cũ hoàn thành.
#
# ============================================================

concurrency:

  group: anime-cache-update

  cancel-in-progress: false

# ============================================================
# JOB
# ============================================================

jobs:

  update-anime-cache:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================
      #
      # fetch-depth: 0 rất quan trọng.
      #
      # Incremental mode cần đọc:
      #
      # github.event.before
      #
      # để biết anime ID nào đã được thêm vào commit hiện tại.
      #
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      # ======================================================
      # NODE.JS
      # ======================================================

      - name: Setup Node.js

        uses: actions/setup-node@v4

        with:

          node-version: 20

      # ======================================================
      # INSTALL AWS SDK
      # ======================================================

      - name: Install dependencies

        run: |

          npm install --no-save @aws-sdk/client-s3

      # ======================================================
      # UPDATE CLOUDFLARE R2
      # ======================================================

      - name: Update Cloudflare R2

        env:

          R2_ACCESS_KEY_ID:
            ${{ secrets.R2_ACCESS_KEY_ID }}

          R2_SECRET_ACCESS_KEY:
            ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_ENDPOINT:
            https://5cdad020d02db4b8aa5b7b96fe8282ce.r2.cloudflarestorage.com

          R2_BUCKET:
            ogeview-anime

          # --------------------------------------------------
          # PUSH
          # → incremental
          #
          # SCHEDULE / MANUAL
          # → full
          # --------------------------------------------------

          UPDATE_MODE:
            ${{ github.event_name == 'push' && 'incremental' || 'full' }}

          # --------------------------------------------------
          # SHA trước khi push
          #
          # update-cache.js dùng giá trị này để lấy
          # anime-ids.json của commit trước.
          # --------------------------------------------------

          GITHUB_EVENT_BEFORE:
            ${{ github.event.before }}

          GITHUB_SHA:
            ${{ github.sha }}

        run:

          node update-cache.js

      # ======================================================
      # CHECK ANIME LIST CHANGES
      # ======================================================
      #
      # update-cache.js có thể cập nhật:
      #
      # "Anime 196017"
      #
      # thành tên thật lấy từ AniList.
      #
      # ======================================================

      - name: Check anime list changes

        id: check_changes

        run: |

          if git diff --quiet -- anime-ids.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      # ======================================================
      # COMMIT UPDATED NAMES
      # ======================================================
      #
      # Chỉ commit nếu update-cache.js thực sự thay đổi
      # anime-ids.json.
      #
      # ======================================================

      - name: Commit updated anime names

        if:
          steps.check_changes.outputs.changed == 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anime-ids.json

          git commit -m "Update anime names"

          git push
