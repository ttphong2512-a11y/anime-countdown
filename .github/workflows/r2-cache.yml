# ============================================================
# WHY2YUE — R2 ANIME CACHE
# ============================================================
#
# anime-ids.json
#       ↓
# update-cache.js
#       ↓
# AniList
#       ↓
# Cloudflare R2
#
# Chỉ cập nhật những AniList ID có trong anime-ids.json.
#
# Ví dụ:
#
# [
#   {
#     "id": 21,
#     "name": "ONE PIECE"
#   },
#   {
#     "id": 196017,
#     "name": "Anime 196017"
#   }
# ]
#
# R2:
#
# anime/21.json
# anime/196017.json
#
# ============================================================


name: Update Anime Cache


# ============================================================
# TRIGGER
# ============================================================

on:

  # ----------------------------------------------------------
  # TỰ ĐỘNG
  # ----------------------------------------------------------
  #
  # Chạy mỗi 3 giờ.
  #
  # 00:17
  # 03:17
  # 06:17
  # 09:17
  # ...
  #
  # ----------------------------------------------------------

  schedule:

    - cron: "17 */3 * * *"


  # ----------------------------------------------------------
  # CHẠY THỦ CÔNG
  # ----------------------------------------------------------

  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  update-anime-cache:

    runs-on:
      ubuntu-latest


    steps:


      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name:
          Checkout repository

        uses:
          actions/checkout@v4


      # ======================================================
      # 2. NODE.JS
      # ======================================================

      - name:
          Setup Node.js

        uses:
          actions/setup-node@v4

        with:

          node-version:
            20


      # ======================================================
      # 3. INSTALL AWS SDK
      # ======================================================
      #
      # update-cache.js sử dụng:
      #
      # @aws-sdk/client-s3
      #
      # để ghi dữ liệu vào Cloudflare R2.
      #
      # ======================================================

      - name:
          Install dependencies

        run: |

          npm install --no-save @aws-sdk/client-s3


      # ======================================================
      # 4. UPDATE R2
      # ======================================================
      #
      # Đọc:
      #
      # anime-ids.json
      #
      # Sau đó:
      #
      # AniList → R2
      #
      # ======================================================

      - name:
          Update Cloudflare R2

        env:

          R2_ACCESS_KEY_ID:
            ${{ secrets.R2_ACCESS_KEY_ID }}

          R2_SECRET_ACCESS_KEY:
            ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_ENDPOINT:
            https://5cdad020d02db4b8aa5b7b96fe8282ce.r2.cloudflarestorage.com

          R2_BUCKET:
            ogeview-anime


        run:

          node update-cache.js


      # ======================================================
      # 5. KIỂM TRA THAY ĐỔI anime-ids.json
      # ======================================================
      #
      # update-cache.js có thể tự cập nhật:
      #
      # "Anime 196017"
      #
      # thành tên thật lấy từ AniList.
      #
      # ======================================================

      - name:
          Check anime list changes

        id:
          check_changes

        run: |

          if git diff --quiet -- anime-ids.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # 6. COMMIT TÊN ANIME MỚI
      # ======================================================
      #
      # Chỉ commit nếu anime-ids.json thực sự thay đổi.
      #
      # Không tạo commit vô ích mỗi lần workflow chạy.
      #
      # ======================================================

      - name:
          Commit updated anime names

        if:
          steps.check_changes.outputs.changed == 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anime-ids.json

          git commit -m "Update anime names"

          git push
